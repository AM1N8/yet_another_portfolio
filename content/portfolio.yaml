ai:
  instructions: |
    Read DESIGN.md before generating or modifying UI.

    Treat this YAML file as the single source of truth for personal content.
    Do not invent missing facts, project metrics, links, dates, companies,
    awards, publications, skills, or employment.

    Empty optional fields should usually cause the corresponding UI element
    to be omitted instead of displaying placeholder text.

    Prioritize visual polish, typography, spacing, responsiveness,
    accessibility, and performance over adding more effects.

    The activity visualization is the signature interactive feature.
    It should be elegant and technically impressive but must degrade
    gracefully on mobile and under prefers-reduced-motion.

    Avoid turning the site into a generic cyberpunk, glassmorphism,
    component-library, or SaaS aesthetic.
