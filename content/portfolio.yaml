      one_liner: "An intelligent platform for classifying, analyzing, and assisting with SCADA alerts and maintenance complaints."

      summary: |
        Built an end-to-end AI system for SCADA alert and maintenance complaint management.
        The platform combines NLP classification, structured maintenance data, and a GraphRAG
        conversational copilot delivered through a FastAPI/React/PostgreSQL stack.

      problem: |
        Industrial SCADA alerts and maintenance complaints generate large volumes of operational
        information that need to be classified, interpreted, and connected to maintenance knowledge.

      why_it_matters: |
        Better organization and analysis of alerts can support faster maintenance investigation
        and more usable access to operational knowledge.

      constraints: []

      approach: |
        Combined embeddings with TF-IDF and Logistic Regression for NLP classification, used
        Random Forest within the ML pipeline, and developed a conversational analysis layer
        using GraphRAG with Neo4j, FAISS, an LLM, and a hybrid query router.

      architecture:
        summary: |
          SCADA and maintenance data feed an NLP/ML processing layer and a knowledge/retrieval layer.
          The resulting capabilities are exposed through FastAPI and consumed by a React application
          backed by PostgreSQL, Neo4j, and FAISS.
